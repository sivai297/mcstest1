<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MCS Admin Login</title>

    <link rel="stylesheet" href="../css/admin.css">

</head>

<body>

    <div class="admin-login">

        <img src="../assets/logo.png"
     alt="MCS Logo"
     class="admin-logo">

        <h1>Meenakshi Control System</h1>

        <p>
            Admin Login Panel
        </p>

        <input
            id="email"
            type="email"
            placeholder="Admin Email">

        <input
            id="password"
            type="password"
            placeholder="Password">

        <button
            id="loginBtn"
            class="login-btn">

            Login

        </button>

        <p id="message"></p>

    </div>

    <script type="module"
            src="../js/admin-login.js"></script>

</body>

</html>
